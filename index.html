<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>픽셀 배틀</title><link rel="icon" href="data:,">
<style>
*{box-sizing:border-box}
:root{--bg:#efeaff;--fg:#21183a;--cd:#fff;--ac:#7a5cff;--ln:#d6cdf5;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#15112a;--fg:#efeaff;--cd:#241d40;--ln:#3b3162}}
:root[data-theme=dark]{--bg:#15112a;--fg:#efeaff;--cd:#241d40;--ln:#3b3162}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--fg);font:15px/1.4 system-ui,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;-webkit-user-select:none;user-select:none;touch-action:manipulation}
#app{max-width:960px;margin:auto;padding:12px}
h1{text-align:center;margin:8px 0}h2{margin:0 0 8px}
.hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.b{background:var(--ac);color:#fff;border:0;border-radius:12px;padding:12px 16px;font:inherit;font-weight:700;cursor:pointer;width:100%;margin:4px 0}
.b.s{background:var(--cd);color:var(--fg);border:1px solid var(--ln);width:auto}
.hd .b{width:auto;padding:8px 12px}
.g{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cd{background:var(--cd);border:2px solid var(--ln);border-radius:16px;padding:14px;margin:8px 0}
.dx{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:8px}
input{width:100%;padding:12px;margin:5px 0;border-radius:10px;border:1px solid var(--ln);background:var(--bg);color:var(--fg);font:inherit;-webkit-user-select:text;user-select:text}
.er{color:#e5484d;min-height:20px}
.pv{width:160px;height:128px;image-rendering:pixelated;display:block;margin:0 auto}
.lb{text-align:center;font-size:12px;opacity:.7;min-height:18px}
.bar{height:14px;border-radius:8px;background:var(--ln);overflow:hidden;margin:8px 0}.bar i{display:block;height:100%}
.row{padding:6px 8px;border-radius:8px;display:flex;justify-content:space-between}
.w{position:relative}
#cv{width:100%;display:block;image-rendering:pixelated;border-radius:12px;background:#7fb9ff}
.ov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;background:rgba(0,0,0,.65);color:#fff;border-radius:12px}.ov[hidden]{display:none}
.ov .b{width:auto;margin:4px}
.tc{display:none;justify-content:space-between;align-items:center;margin-top:10px}
@media(pointer:coarse),(max-width:700px){.tc{display:flex}}
.tc b{width:58px;height:58px;border-radius:50%;background:rgba(122,92,255,.85);color:#fff;display:grid;place-items:center;font-size:20px;touch-action:none}
.pad{display:grid;grid-template-columns:repeat(3,58px);grid-template-rows:repeat(2,58px);gap:6px}
[data-k=U]{grid-column:2;grid-row:1}[data-k=L]{grid-column:1;grid-row:2}[data-k=D]{grid-column:2;grid-row:2}[data-k=R]{grid-column:3;grid-row:2}
body.mb h1,body.mb .hd,body.mb>#app>p{color:#fff;text-shadow:0 2px 0 #1a1428}body.mb .pv{filter:drop-shadow(0 4px 0 rgba(0,0,0,.35))}.bgp{display:none}.ab{display:flex;gap:8px}.ic{width:32px;height:32px;image-rendering:pixelated}.ic.big{width:64px;height:64px}.av{width:44px;height:44px;border-radius:50%;background:var(--ln);cursor:pointer;image-rendering:pixelated}.av.big{width:64px;height:64px}

/* ---------- background music (YouTube) ---------- */
const MUSIC_VIDEO={menu:'s61vBsyvU1w',battle:'2hlTE3L01so'};
let musicScene='menu',musicEnabled=S.g('pb_music_enabled',true),musicUnlocked=false;
let ytMusicPlayer=null,ytMusicReady=false,ytMusicLoadedScene=null,ytMusicPlaying=false,ytMusicError=0,ytApiRequested=false;
function updateMusicButton(){
 const b=$('#music-toggle');if(!b)return;
 b.textContent=!musicEnabled?'♫ 음악 OFF':ytMusicPlaying?(musicScene==='battle'?'♫ 전투 음악':'♫ 메뉴 음악'):ytMusicError?'♫ 재생 오류':'♫ 음악 켜기';
 b.setAttribute('aria-label',musicEnabled?'음악 끄기':'음악 켜기');
}
function playCurrentMusic(forceReload=false){
 if(!musicEnabled||!musicUnlocked||!ytMusicReady||!ytMusicPlayer)return;
 try{
  if(forceReload||ytMusicLoadedScene!==musicScene){
   ytMusicLoadedScene=musicScene;
   ytMusicPlayer.loadVideoById({videoId:MUSIC_VIDEO[musicScene],startSeconds:0});
  }else ytMusicPlayer.playVideo();
 }catch(e){ytMusicError=-1;updateMusicButton()}
}
function setMusicScene(scene){
 if(scene!=='menu'&&scene!=='battle')return;
 const changed=musicScene!==scene;musicScene=scene;
 if(changed&&musicEnabled&&musicUnlocked&&ytMusicReady)playCurrentMusic(true);
 updateMusicButton();
}
function unlockMusic(){
 if(!musicEnabled)return;
 musicUnlocked=true;
 if(ytMusicReady)playCurrentMusic();
}
function toggleMusic(){
 musicEnabled=!musicEnabled;S.s('pb_music_enabled',musicEnabled);
 if(musicEnabled){musicUnlocked=true;playCurrentMusic();}
 else if(ytMusicPlayer){try{ytMusicPlayer.pauseVideo()}catch(e){}}
 updateMusicButton();
}
function createYouTubeMusicPlayer(){
 if(ytMusicPlayer||!window.YT||!window.YT.Player)return;
 const vars={autoplay:0,controls:0,disablekb:1,fs:0,iv_load_policy:3,modestbranding:1,playsinline:1,rel:0};
 if(location.origin&&location.origin!=='null')vars.origin=location.origin;
 ytMusicPlayer=new YT.Player('yt-music-player',{
  width:'200',height:'200',videoId:MUSIC_VIDEO.menu,playerVars:vars,
  events:{
   onReady:()=>{ytMusicReady=true;ytMusicError=0;if(musicUnlocked&&musicEnabled)playCurrentMusic(true);updateMusicButton()},
   onStateChange:e=>{
    const playing=window.YT&&e.data===YT.PlayerState.PLAYING;
    ytMusicPlaying=!!playing;
    if(e.data===YT.PlayerState.ENDED&&musicEnabled&&musicUnlocked){
     try{ytMusicPlayer.seekTo(0,true);ytMusicPlayer.playVideo()}catch(err){}
    }
    updateMusicButton();
   },
   onError:e=>{ytMusicError=e.data||1;ytMusicPlaying=false;updateMusicButton()}
  }
 });
}
function ensureYouTubeMusic(){
 const b=$('#music-toggle');if(b)b.addEventListener('click',toggleMusic);
 document.addEventListener('pointerdown',unlockMusic,true);
 document.addEventListener('keydown',unlockMusic,true);
 if(window.YT&&window.YT.Player){createYouTubeMusicPlayer();return}
 if(ytApiRequested)return;ytApiRequested=true;
 const previous=window.onYouTubeIframeAPIReady;
 window.onYouTubeIframeAPIReady=function(){if(typeof previous==='function')try{previous()}catch(e){}createYouTubeMusicPlayer()};
 const tag=document.createElement('script');tag.src='https://www.youtube.com/iframe_api';tag.async=true;document.head.appendChild(tag);
}
ensureYouTubeMusic();
